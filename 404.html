<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e5aa8">
<meta name="robots" content="noindex">
<script>/* GitHub sert cette page pour toute adresse inconnue, parfois dans un sous-dossier : on retrouve la racine de l'application pour que l'icône et le lien fonctionnent */
(function(){var p=location.pathname.split("/");var b=/\.github\.io$/.test(location.hostname)&&p[1]?"/"+p[1]+"/":"/";document.write('<base href="'+b+'">');})();</script>
<link rel="icon" href="icon-192.png">
<title>Page introuvable – GestPro</title>
<style>
:root{--p:#1e5aa8;--bg:#f3f6fb;--tx:#18222f;--mut:#6b7788;--bd:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:min(440px,100%);background:#fff;border:1px solid var(--bd);border-top:4px solid var(--p);border-radius:14px;padding:24px 22px;box-shadow:0 6px 24px #1e5aa826;text-align:center}
img{width:64px;height:64px;border-radius:14px}
h1{margin:12px 0 6px;font-size:20px;color:var(--p)}
p{margin:0 0 18px;color:var(--mut)}
a{display:inline-block;background:var(--p);color:#fff;text-decoration:none;border-radius:9px;padding:10px 18px}
</style>
</head>
<body>
<main>
<img src="icon-192.png" alt="">
<h1>Page introuvable</h1>
<p>Cette adresse n'existe pas dans GestPro. Revenez à l'accueil pour continuer.</p>
<a href="./" id="home">Retour à GestPro</a>
</main>
</body>
</html>
